services:
  gmail-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naiimos-gmail-mcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3100
      - GMAIL_MCP_ACCESS_TOKEN=${GMAIL_MCP_ACCESS_TOKEN}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
    ports:
      # Bound strictly to loopback interface on the host VPS (internal only)
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
