name: Case Study Validation
# CI gate for CMS content, structured arrays, media overrides, native order/visibility, localization, and production rendering.

on:
  pull_request:
    paths:
      - 'src/admin/components/cms/CaseStudyContentEditor.jsx'
      - 'src/admin/components/cms/UnifiedCaseStudyEditor.jsx'
      - 'src/admin/pages/AdminRegistryEntry.jsx'
      - 'src/components/case-study/**'
      - 'src/pages/custom-case-studies/**'
      - 'src/services/caseStudyRegistryMigration.js'
      - 'src/services/customCaseStudyContent.js'
      - 'src/services/caseStudySchema.js'
      - 'src/services/caseStudyEditorModel.js'
      - 'src/services/contentRegistry.js'
      - 'src/utils/caseStudyContent.js'
      - 'src/utils/registryHealth.js'
      - 'scripts/test-native-case-study-cms-bindings.mjs'
      - 'scripts/test-custom-case-study-content.mjs'
      - 'scripts/test-unified-case-study-foundation.mjs'
      - 'docs/custom-case-study-cms-schema.md'
      - 'docs/unified-case-study-architecture.md'
      - 'src/styles/style.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/case-study-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate case-study changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run validate:i18n

      - name: Test case-study stages
        run: npm run test:case-study-stages

      - name: Test localized custom case-study content
        run: npm run test:custom-case-study-content

      - name: Test native case-study CMS bindings
        run: npm run test:native-case-study-cms

      - name: Test unified case-study schema
        run: npm run test:unified-case-study

      - name: Build production bundle
        run: npm run build
