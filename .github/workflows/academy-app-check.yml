name: My Academy app checks

on:
  push:
    branches:
      - release/my-academy-clean
    paths:
      - "src/App.jsx"
      - "src/admin/**"
      - "scripts/test-academy-access.mjs"
      - "scripts/test-iqra-cms-integration.mjs"
      - "supabase/functions/iqra-admin-bootstrap/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/academy-app-check.yml"
      - ".github/workflows/supabase-migration-replay.yml"
  pull_request:
    paths:
      - "src/App.jsx"
      - "src/admin/**"
      - "scripts/test-academy-access.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/academy-app-check.yml"

permissions:
  contents: read

jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Academy admin access boundaries
        run: npm run test:academy-access

      - name: Verify IQRA CMS integration boundaries
        run: npm run test:iqra-cms

      - name: Build production bundle
        run: npm run build
