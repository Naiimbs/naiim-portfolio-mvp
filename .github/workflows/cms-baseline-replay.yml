name: CMS migration baseline replay

on:
  push:
    branches:
      - fix/cms-registry-page-seed-order
    paths:
      - "supabase/migrations/007_cms_registry.sql"
      - ".github/workflows/cms-baseline-replay.yml"

permissions:
  contents: read

jobs:
  baseline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Replay all migrations on a clean database
        run: supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
