name: IQRA CMS integration checks

on:
  pull_request:
    paths:
      - "src/App.jsx"
      - "src/admin/**"
      - "scripts/test-iqra-*.mjs"
      - "supabase/functions/iqra-admin-*/**"
      - "supabase/tests/fixtures/iqra-admin-e2e.sql"
      - "package.json"
      - ".github/workflows/iqra-cms-integration-check.yml"

concurrency:
  group: iqra-cms-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify IQRA CMS trust boundaries
        run: npm run test:iqra-cms
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test administrator grant and revocation handlers
        run: deno test --allow-env supabase/functions/iqra-admin-lifecycle/index_test.ts
      - name: Build production bundle
        run: npm run build

  local-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Isolate disposable E2E stack from legacy CMS migrations
        shell: bash
        run: |
          if [ -d supabase/migrations ]; then
            mv supabase/migrations /tmp/iqra-cms-legacy-migrations
          fi
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql /tmp/iqra-cms-legacy-seed.sql
          fi
          mkdir -p supabase/migrations
      - name: Start disposable local Supabase
        run: supabase start
      - name: Create minimal local IQRA authorization schema
        shell: bash
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/iqra-admin-e2e.sql
      - name: Serve actual IQRA Edge Functions
        shell: bash
        run: |
          anon_key="$(supabase status --output-format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);const e=v.env||v;process.stdout.write(e.ANON_KEY||e.PUBLISHABLE_KEY||'')})")"
          test -n "$anon_key"
          nohup supabase functions serve > /tmp/iqra-functions.log 2>&1 &
          for attempt in $(seq 1 45); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $anon_key" -X POST http://127.0.0.1:54321/functions/v1/iqra-admin-bootstrap || true)"
            if [ "$status" = "401" ]; then
              echo "IQRA Edge Function gateway is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/iqra-functions.log
          exit 1
      - name: Verify real local Auth and IQRA admin lifecycle
        run: node scripts/test-iqra-admin-e2e.mjs
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
