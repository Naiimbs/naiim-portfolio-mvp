name: Supabase migration replay

on:
  push:
    branches:
      - feature/my-academy-mvp
    paths:
      - "supabase/**"
  pull_request:
    paths:
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Replay every migration on a clean local database
        run: supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
