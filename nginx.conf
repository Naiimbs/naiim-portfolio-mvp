server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Explicit 301 Redirects for Known Legacy URLs
    location = /case-studies {
        return 301 /work;
    }
    location = /case-studies/ {
        return 301 /work;
    }
    location = /case-studies/winni.html {
        return 301 /work/winni;
    }
    location = /case-studies/assestini.html {
        return 301 /work/assestini;
    }
    location = /case-studies/cha9a9a.html {
        return 301 /work/cha9a9a;
    }
    location = /case-studies/naim-copilot.html {
        return 301 /work/naim-copilot;
    }
    location = /case-studies/career-os.html {
        return 301 /work/career-os;
    }
    location = /case-studies/saudi-government.html {
        return 301 /work/saudi-government;
    }
    location = /case-studies/saudi-banking.html {
        return 301 /work/saudi-banking;
    }
    location = /case-studies/saudi-regulatory.html {
        return 301 /work/saudi-regulatory;
    }
    location = /case-studies/dga.html {
        return 301 /work/dga;
    }

    # 2. Immutable Vite Assets (content-hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Static SEO & Brand Files (Return 404 if missing, never index.html)
    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|webp|avif|webmanifest|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 4. React SPA Deep-Link & 404 Fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 5. Server Error Handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
